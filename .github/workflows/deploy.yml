name: Deploy Spring Boot To EC2 (SSH)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set Up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Build (Maven)
      run: mvn -B -DskipTests package

    - name: Prepare SSH key (from base64 secret)
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > "$GITHUB_WORKSPACE/deploy_key"
        chmod 644 "$GITHUB_WORKSPACE/deploy_key"

    - name: Copy jar to EC2 (/opt/myapp)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key_path: /github/workspace/deploy_key
        source: "target/*.jar"
        target: "/opt/myapp"

    - name: Activate jar as app.jar + restart service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key_path: /github/workspace/deploy_key
        script: |
          set -euo pipefail
          cd /opt/myapp
          ls -lah
          JAR="$(ls -t *.jar | head -n 1)"
          echo "Using $JAR"
          cp "$JAR" app.jar
          sudo systemctl daemon-reload
          sudo systemctl restart myapp
          sudo systemctl status myapp --no-pager

    - name: Cleanup key
      if: always()
      run: rm -f "$GITHUB_WORKSPACE/deploy_key"
